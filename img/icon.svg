<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a"/>
      <stop offset="100%" style="stop-color:#0d1f15"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Board outline -->
  <rect x="80" y="80" width="352" height="352" rx="8" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <!-- Inner board -->
  <rect x="130" y="130" width="252" height="252" rx="4" fill="none" stroke="#4CAF50" stroke-width="2" opacity="0.5"/>
  <!-- Corner squares -->
  <rect x="80" y="80" width="50" height="50" fill="#DC143C" opacity="0.8" rx="4"/>
  <rect x="382" y="80" width="50" height="50" fill="#FF8C00" opacity="0.8" rx="4"/>
  <rect x="80" y="382" width="50" height="50" fill="#4169E1" opacity="0.8" rx="4"/>
  <rect x="382" y="382" width="50" height="50" fill="#228B22" opacity="0.8" rx="4"/>
  <!-- Color bars (top) -->
  <rect x="140" y="80" width="30" height="12" fill="#DC143C" rx="2"/>
  <rect x="175" y="80" width="30" height="12" fill="#DC143C" rx="2"/>
  <rect x="220" y="80" width="30" height="12" fill="#FFD700" rx="2"/>
  <rect x="255" y="80" width="30" height="12" fill="#FFD700" rx="2"/>
  <rect x="300" y="80" width="30" height="12" fill="#FFD700" rx="2"/>
  <rect x="345" y="80" width="30" height="12" fill="#228B22" rx="2"/>
  <!-- Title text -->
  <text x="256" y="240" font-family="Georgia,serif" font-size="36" fill="url(#gold)" text-anchor="middle" font-weight="bold">PROPERTY</text>
  <text x="256" y="290" font-family="Georgia,serif" font-size="42" fill="#fff" text-anchor="middle" font-weight="bold" font-style="italic">TYCOON</text>
  <!-- Dice -->
  <rect x="210" y="310" width="40" height="40" rx="6" fill="#fff"/>
  <circle cx="222" cy="322" r="3" fill="#333"/>
  <circle cx="238" cy="322" r="3" fill="#333"/>
  <circle cx="230" cy="338" r="3" fill="#333"/>
  <rect x="260" y="310" width="40" height="40" rx="6" fill="#fff"/>
  <circle cx="272" cy="322" r="3" fill="#333"/>
  <circle cx="288" cy="338" r="3" fill="#333"/>
  <circle cx="280" cy="330" r="3" fill="#333"/>
  <circle cx="272" cy="338" r="3" fill="#333"/>
  <circle cx="288" cy="322" r="3" fill="#333"/>
</svg>
